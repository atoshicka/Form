services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: form
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d form"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://app:app_password@db:5432/form
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
  client:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata: